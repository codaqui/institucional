services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    container_name: codaqui_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-codaqui}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-codaqui_db}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - codaqui-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${DB_USER:-codaqui} -d $${DB_NAME:-codaqui_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codaqui_backend
    env_file:
      - .env
    ports:
      - "3001:3000" # http://localhost:3001
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-codaqui}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-codaqui_db}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-${TURNSTILE_SECRET_KEY:-}}
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES:-${TURNSTILE_ALLOWED_HOSTNAMES:-}}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:3001}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - HTTPS=${HTTPS:-false}
      - SSL_CRT_FILE=/app/.certs/localhost.pem
      - SSL_KEY_FILE=/app/.certs/localhost-key.pem
    volumes:
      - ./.certs:/app/.certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codaqui-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS --max-redirs 0 http://localhost:3000/ || curl -fsS --max-redirs 0 --cacert /app/.certs/rootCA.pem https://localhost:3000/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: codaqui_frontend
    environment:
      NODE_ENV: development
      HTTPS: ${HTTPS:-false}
      SITE_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-${TURNSTILE_SITE_KEY:-}}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - codaqui-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS --max-redirs 0 http://localhost:3000/ || curl -fsS --max-redirs 0 --cacert /app/.certs/rootCA.pem https://localhost:3000/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12

  # Stripe CLI — encaminha webhooks do Stripe para o backend local
  # Requer STRIPE_SECRET_KEY no .env. Inicie 1x para ver o webhook secret:
  # podman logs codaqui_stripe_cli
  stripe-cli:
    container_name: codaqui_stripe_cli
    image: stripe/stripe-cli:latest
    command:
      - listen
      - --forward-to
      - ${STRIPE_FORWARD_URL:-http://backend:3000/stripe/webhook}
      - --skip-verify
      - --events
      - checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,invoice.payment_succeeded,charge.refunded,charge.succeeded,charge.updated,customer.subscription.deleted,customer.subscription.updated
    env_file:
      - .env
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_DEVICE_NAME: codaqui-dev
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - codaqui-network

networks:
  codaqui-network:
    driver: bridge

volumes:
  pgdata:
  frontend_node_modules:
