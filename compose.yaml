services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    container_name: codaqui_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-codaqui}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-codaqui_db}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - codaqui-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${DB_USER:-codaqui} -d $${DB_NAME:-codaqui_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codaqui_backend
    env_file:
      - .env
    ports:
      - "3001:3000" # http://localhost:3001
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-codaqui}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-codaqui_db}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:3001}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - HTTPS=${HTTPS:-false}
      - SSL_CRT_FILE=/app/.certs/localhost.pem
      - SSL_KEY_FILE=/app/.certs/localhost-key.pem
    volumes:
      - ./.certs:/app/.certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codaqui-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/ || wget -qO- --no-check-certificate https://localhost:3000/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  docusaurus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codaqui_docusaurus
    env_file:
      - .env
    environment:
      - HTTPS=${HTTPS:-false}
      - SSL_CRT_FILE=/app/.certs/localhost.pem
      - SSL_KEY_FILE=/app/.certs/localhost-key.pem
      - DOCUSAURUS_API_URL=${BACKEND_URL:-http://localhost:3001}
    ports:
      - "3000:3000" # http(s)://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.docusaurus
      - ./.certs:/app/.certs:ro
    networks:
      - codaqui-network

  # Stripe CLI — encaminha webhooks do Stripe para o backend local
  # Requer STRIPE_SECRET_KEY no .env. Inicie 1x para ver o webhook secret:
  # podman logs codaqui_stripe_cli
  stripe-cli:
    container_name: codaqui_stripe_cli
    image: stripe/stripe-cli:latest
    command: listen --forward-to http://backend:3000/stripe/webhook --skip-verify
    env_file:
      - .env
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_DEVICE_NAME: codaqui-dev
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - codaqui-network

networks:
  codaqui-network:
    driver: bridge

volumes:
  pgdata:
