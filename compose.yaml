services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    container_name: codaqui_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-codaqui}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-codaqui_db}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - codaqui-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codaqui_backend
    env_file:
      - .env
    ports:
      - "3001:3000" # http://localhost:3001
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-codaqui}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-codaqui_db}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:3001}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - postgres
    networks:
      - codaqui-network

  docusaurus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codaqui_docusaurus
    env_file:
      - .env
    ports:
      - "3000:3000" # http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.docusaurus
    networks:
      - codaqui-network

  # Stripe CLI — encaminha webhooks do Stripe para o backend local
  # Requer STRIPE_SECRET_KEY no .env. Inicie 1x para ver o webhook secret:
  # podman logs codaqui_stripe_cli
  stripe-cli:
    container_name: codaqui_stripe_cli
    image: stripe/stripe-cli:latest
    command: listen --forward-to http://backend:3000/stripe/webhook --skip-verify
    env_file:
      - .env
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_DEVICE_NAME: codaqui-dev
    depends_on:
      - backend
    networks:
      - codaqui-network

  # Workers Cloudflare — proxies reversos para domínios próprios das comunidades.
  # Disponibilizam http://<slug>.localhost:<porta> mapeando para o Docusaurus
  # e encaminham /api, /auth, /stripe, /ledger, /members para o backend.
  worker-tisocial:
    container_name: codaqui_worker_tisocial
    image: node:24-slim
    working_dir: /app
    command: >
      sh -c "npx wrangler dev --config workers/tisocial/wrangler.dev.toml --local --port 8787 --ip 0.0.0.0"
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules:ro
      - worker-tisocial-cache:/app/workers/tisocial/.wrangler
    depends_on:
      - docusaurus
      - backend
    networks:
      - codaqui-network

  worker-elasnocodigo:
    container_name: codaqui_worker_elasnocodigo
    image: node:24-slim
    working_dir: /app
    command: >
      sh -c "npx wrangler dev --config workers/elasnocodigo/wrangler.dev.toml --local --port 8788 --ip 0.0.0.0"
    ports:
      - "8788:8788"
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules:ro
      - worker-elasnocodigo-cache:/app/workers/elasnocodigo/.wrangler
    depends_on:
      - docusaurus
      - backend
    networks:
      - codaqui-network

  worker-devparana:
    container_name: codaqui_worker_devparana
    image: node:24-slim
    working_dir: /app
    command: >
      sh -c "npx wrangler dev --config workers/devparana/wrangler.dev.toml --local --port 8789 --ip 0.0.0.0"
    ports:
      - "8789:8789"
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules:ro
      - worker-devparana-cache:/app/workers/devparana/.wrangler
    depends_on:
      - docusaurus
      - backend
    networks:
      - codaqui-network

networks:
  codaqui-network:
    driver: bridge

volumes:
  pgdata:
  worker-tisocial-cache:
  worker-elasnocodigo-cache:
  worker-devparana-cache:
