name: PR Check

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - 'static/events/**/*.override.json'
      - 'static/events/organizers.json'
      - 'static/events/overrides-index.json'
      - 'static/events/internal/**'
      - 'static/events/index.json'

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Resolve PR metadata
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      reuse_develop_preview: ${{ steps.meta.outputs.reuse_develop_preview }}
    steps:
      # Mantido como ponto de sincronização — todos os demais jobs declaram
      # `needs: metadata`. O output reuse_develop_preview perdeu os
      # consumidores (jobs de preview do legado Docusaurus) removidos na
      # Fase 0.6.
      - name: Detect develop-to-main PR
        id: meta
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$PR_BASE" = "main" ] && [ "$PR_HEAD" = "develop" ]; then
            echo "reuse_develop_preview=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse_develop_preview=false" >> "$GITHUB_OUTPUT"
          fi

  backend-check:
    name: Backend CI
    runs-on: ubuntu-slim
    needs: metadata
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --ignore-scripts

      - name: Run Backend Build
        working-directory: ./backend
        run: npm run build

      - name: Run Backend Tests with Coverage
        working-directory: ./backend
        run: |
          set -o pipefail
          ./node_modules/.bin/jest --coverage --coverageReporters=json-summary --coverageReporters=text 2>&1 | tee backend-coverage.txt

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/backend-coverage.txt
            backend/coverage/coverage-summary.json
          retention-days: 3

  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy (frontend — vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH,MEDIUM'
          skip-dirs: 'backend,node_modules'

      - name: Upload frontend scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend'

      - name: Run Trivy (backend — vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          scanners: 'vuln,secret,misconfig'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH,MEDIUM'
          skip-dirs: 'node_modules'
          skip-setup-trivy: true

      - name: Upload backend scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-slim
    needs:
      - backend-check
    if: always() && !cancelled()
    permissions:
      pull-requests: write
    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend-cov/
        continue-on-error: true

      - name: Generate coverage comment
        id: coverage
        run: |
          {
            echo "## 📊 Test Coverage Report"
            echo ""
            echo "### Backend"
            echo ""

            if [ -f backend-cov/coverage/coverage-summary.json ]; then
              BE_STMTS=$(jq -r '.total.statements.pct' backend-cov/coverage/coverage-summary.json)
              BE_BRANCH=$(jq -r '.total.branches.pct' backend-cov/coverage/coverage-summary.json)
              BE_FUNCS=$(jq -r '.total.functions.pct' backend-cov/coverage/coverage-summary.json)
              BE_LINES=$(jq -r '.total.lines.pct' backend-cov/coverage/coverage-summary.json)
              echo "| Statements | Branches | Functions | Lines |"
              echo "|:---:|:---:|:---:|:---:|"
              echo "| ${BE_STMTS}% | ${BE_BRANCH}% | ${BE_FUNCS}% | ${BE_LINES}% |"
              echo ""
            else
              echo "⚠️ Coverage data not available"
              echo ""
            fi

            echo "---"
            echo "<sub>Generated by PR Check workflow</sub>"
          } > coverage-comment.md

          cat coverage-comment.md

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage-report
          path: coverage-comment.md

  astro-tenants:
    name: Astro Tenants Build (${{ matrix.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # codaqui roda com TENANT vazio de propósito — TENANT_BY_NAME não tem
          # "codaqui" e o astro.config.mjs lançaria "TENANT desconhecido".
          - { tenant: "", project: codaqui, site: "https://codaqui.dev" }
          - { tenant: tisocial, project: tisocial, site: "https://tisocial.org.br" }
          - { tenant: elasnocodigo, project: elasnocodigo, site: "https://elasnocodigo.com.br" }
          - { tenant: devparana, project: devparana, site: "https://devparana.org" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & build (${{ matrix.project }})
        working-directory: frontend
        env:
          TENANT: ${{ matrix.tenant }}
          SITE_URL: ${{ matrix.site }}
        run: |
          npm ci --ignore-scripts
          npm run build

  astro-codaqui:
    name: Astro codaqui (build + check + test)
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      # Build primeiro: o prebuild roda sync:content (snapshots + conteúdo),
      # que check e test precisam em seguida.
      - name: Build (codaqui)
        working-directory: frontend
        env:
          TENANT: ""
          SITE_URL: "https://codaqui.dev"
        run: npm run build

      - name: Astro check (codaqui)
        working-directory: frontend
        run: npm run check

      - name: Vitest (codaqui)
        working-directory: frontend
        run: npm run test
