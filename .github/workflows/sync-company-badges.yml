name: Sync Company Badges

on:
  workflow_dispatch:
  schedule:
    - cron: "19 6 * * *"

permissions: {}

concurrency:
  group: sync-company-badges
  cancel-in-progress: true

jobs:
  sync:
    name: Sync company badges
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate company badges
        env:
          COMPANY_BADGES_API_URL: https://api.codaqui.dev
        run: npm run sync:company-badges

      - name: Commit updated badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/badges/empresas

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: sync company badges"
          git push
