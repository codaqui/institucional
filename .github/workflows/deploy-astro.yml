name: Deploy Astro (Pages)

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant único (vazio = todos)"
        required: false
        default: ""

# Build + deploy dos 4 tenants Astro da Fase 0.5 (direct upload no Pages).
# O matrix espelha frontend/tenants.config.mjs (manter sincronizado).
# ATENÇÃO: o entry codaqui roda com TENANT VAZIO de propósito — TENANT_BY_NAME
# (frontend/tenants.config.mjs) não tem "codaqui" e o astro.config.mjs lançaria
# "TENANT desconhecido". String vazia é falsy no config e cai no build do site
# principal (srcDir ./src).
concurrency:
  group: deploy-astro-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    name: Build & Deploy (${{ matrix.project }})
    runs-on: ubuntu-latest
    env:
      # `secrets` não é contexto válido em steps.if (só github, needs, job,
      # runner, env, vars, inputs, matrix, strategy, steps) — o guard é
      # mapeado p/ env aqui no job e lido via env.* nos steps.
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    # `if` em nível de STEP: job-level if não enxerga `matrix` no GitHub Actions.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tenant: "", project: codaqui, site: "https://codaqui.dev" }
          - { tenant: tisocial, project: tisocial, site: "https://tisocial.org.br" }
          - { tenant: elasnocodigo, project: elasnocodigo, site: "https://elasnocodigo.com.br" }
          - { tenant: devparana, project: devparana, site: "https://devparana.org" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build (${{ matrix.project }})
        # Sem secrets os steps são pulados (job fica verde) — até lá, os gates
        # locais do frontend são a fonte de verdade (runbook na T11).
        if: ${{ env.HAS_CLOUDFLARE_TOKEN == 'true' && (github.event.inputs.tenant == '' || github.event.inputs.tenant == matrix.tenant) }}
        working-directory: frontend
        env:
          TENANT: ${{ matrix.tenant }}
          SITE_URL: ${{ matrix.site }}
        run: |
          npm ci --ignore-scripts
          npm run build

      # Roda na raiz para reusar o wrangler das devDependencies do package.json
      # raiz (npx não o baixa de novo). `--branch` cria branch deployment para
      # previews; vira production quando a branch é a production branch do
      # projeto Pages (main).
      - name: Deploy direct upload (${{ matrix.project }})
        if: ${{ env.HAS_CLOUDFLARE_TOKEN == 'true' && (github.event.inputs.tenant == '' || github.event.inputs.tenant == matrix.tenant) }}
        run: npx wrangler pages deploy frontend/dist --project-name=${{ matrix.project }} --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
